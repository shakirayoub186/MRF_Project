<template>
    <template if:true={mrfName}>
        <div class="slds-box slds-theme_default">
            <div class="slds-media slds-m-bottom_small">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="utility:info" alternative-text="info" size="small"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h3 class="slds-text-heading_small slds-m-bottom_x-small">Information</h3>
                    <div class="slds-grid slds-wrap">
                        <div class="slds-col slds-size_1-of-3 slds-p-around_x-small">
                            <p><strong>MRF Name</strong><br />{mrfName}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-3 slds-p-around_x-small">
                            <p><strong>Owner Name</strong><br />{ownerName}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-3 slds-p-around_x-small">
                            <p><strong>Requested Date</strong><br />{requestedDate}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
</template>
