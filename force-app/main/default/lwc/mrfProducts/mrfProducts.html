<template>
    <lightning-card>
        <!-- Header with Add Button -->
        <div class="slds-grid slds-grid_align-spread slds-p-horizontal_medium slds-p-vertical_small slds-border_bottom">
            <h2 class="slds-text-heading_small slds-truncate" title="Add MRF Products">Add MRF Products</h2>
            <!-- Button to add a new empty row -->
            <lightning-button variant="brand" label="Add New Product" onclick={addRow}></lightning-button>
        </div>

        <!-- Table for displaying dynamic product rows -->
        <div class="slds-p-around_medium">
            <div class="scroll-container">
                <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                    <thead>
                        <tr>
                            <th>Action</th>
                            <th>Category</th>
                            <th>Item</th>
                            <th>Part Number</th>
                            <th>Description</th>
                            <th>List Price (INR)</th>
                            <th>GL</th>
                            <th>GL Name</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Loop through each dynamic row -->
                        <template for:each={productRows} for:item="row" for:index="index">
                            <tr key={row.key}>
                                
                                <!-- Remove Button for the Row -->
                                <td>
                                    <lightning-button-icon icon-name="utility:delete" alternative-text="Remove"
                                        onclick={removeRow} data-index={index}>
                                    </lightning-button-icon>
                                </td>

                                <!-- Category Dropdown (required first step) -->
                                <td>
                                    <lightning-combobox value={row.category} options={categoryOptions}
                                        data-index={index} data-field="category" onchange={handleChange}
                                        variant="label-hidden">
                                    </lightning-combobox>
                                </td>

                                <!-- Item Field (shown only when category is selected) -->
                                <td>
                                    <template if:true={row.showItem}>
                                        <!-- Input field for Non-Inventory -->
                                        <template if:true={row.isNonInventory}>
                                            <lightning-input value={row.item} data-index={index} data-field="item"
                                                onchange={handleChange} variant="label-hidden">
                                            </lightning-input>
                                        </template>

                                        <!-- Dropdown for Inventory -->
                                        <template if:false={row.isNonInventory}>
                                            <lightning-combobox value={row.item} options={itemOptions}
                                                data-index={index} data-field="item" onchange={handleChange}
                                                variant="label-hidden">
                                            </lightning-combobox>
                                        </template>
                                    </template>
                                </td>

                                <!-- Remaining fields (only when item is selected) -->
                                <template if:true={row.showDetails}>
                                    <!-- Part Number -->
                                    <td>
                                        <lightning-input value={row.part} data-index={index} data-field="part"
                                            onchange={handleChange} variant="label-hidden">
                                        </lightning-input>
                                    </td>

                                    <!-- Description -->
                                    <td>
                                        <lightning-input value={row.description} data-index={index}
                                            data-field="description" onchange={handleChange} variant="label-hidden"
                                            style="min-width: 200px;">
                                        </lightning-input>
                                    </td>

                                    <!-- List Price -->
                                    <td>
                                        <lightning-input type="number" value={row.listPrice} data-index={index}
                                            data-field="listPrice" onchange={handleChange} variant="label-hidden">
                                        </lightning-input>
                                    </td>

                                    <!-- GL -->
                                    <td>
                                        <lightning-input type="number" value={row.gl} data-index={index} data-field="gl"
                                            onchange={handleChange} variant="label-hidden" style="min-width: 80px;">
                                        </lightning-input>
                                    </td>

                                    <!-- GL Name -->
                                    <td>
                                        <lightning-input value={row.glName} data-index={index} data-field="glName"
                                            onchange={handleChange} variant="label-hidden">
                                        </lightning-input>
                                    </td>
                                </template>

                                <!-- Empty cells when showDetails is false -->
                                <template if:false={row.showDetails}>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </lightning-card>
</template>
